            <!-- MARKETING SPEND MODAL -->
            <div v-if="activeModal === 'marketingSpendModal'" class="space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Date</label>
                <input type="date" v-model="modalData.marketingSpend.date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl font-bold text-slate-900 dark:text-slate-100 focus:outline-none" :disabled="!!modalData.marketingSpend.id" />
              </div>
              <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Seller</label>
                <select v-model="modalData.marketingSpend.sellerId" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl font-bold text-slate-900 dark:text-slate-100 focus:outline-none" :disabled="!!modalData.marketingSpend.id">
                  <option value="" disabled>Select Seller</option>
                  <option v-for="seller in sellersList" :key="seller.id" :value="seller.id">{{ seller.name }}</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Dollar Spend ($)</label>
                <input type="number" step="0.01" min="0" v-model.number="modalData.marketingSpend.amount" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl font-bold text-slate-900 dark:text-slate-100 focus:outline-none" placeholder="e.g. 50.00" />
              </div>
              
              <div class="flex items-center justify-between gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                <button @click="closeModal" type="button" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl font-bold transition-all text-xs">
                  ✕ Cancel
                </button>
                <button @click="saveMarketingSpend" type="button" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-extrabold shadow-md shadow-indigo-600/20 transition-all text-xs flex items-center gap-1.5" :disabled="!modalData.marketingSpend.date || !modalData.marketingSpend.sellerId">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Save Spend
                </button>
              </div>
            </div>

            <!-- MARKETING SPEND HISTORY MODAL -->
            <div v-if="activeModal === 'marketingSpendHistoryModal'" class="space-y-4 text-xs">
              <h3 class="font-extrabold text-slate-900 dark:text-slate-100 mb-2">Edit History</h3>
              <div class="max-h-60 overflow-y-auto pr-2 space-y-2">
                <div v-for="(hist, idx) in modalData.marketingSpend.history" :key="idx" class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                  <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-slate-800 dark:text-slate-200">${{ hist.amount.toFixed(2) }}</span>
                    <span class="text-[10px] text-slate-400">{{ new Date(hist.timestamp).toLocaleString() }}</span>
                  </div>
                  <div class="text-[10px] text-slate-500">Updated by: <span class="font-medium">{{ hist.updatedBy }}</span></div>
                </div>
                <div v-if="!modalData.marketingSpend.history || modalData.marketingSpend.history.length === 0" class="text-slate-500 italic">No history available.</div>
              </div>
              <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-right">
                <button @click="closeModal" type="button" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl font-bold transition-all">Close</button>
              </div>
            </div>
