        <!-- ==================== MARKETING SPEND TRACKER ==================== -->
        <transition name="pane-fade" mode="out-in">
          <div v-if="(currentUser.role === 'admin' || currentUser.role === 'moderator' || currentUser.role === 'marketer') && activeTab === 'marketing'" key="marketing-spend" class="space-y-6">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
              <div class="flex justify-between items-center mb-6">
                <div>
                  <h2 class="text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Daily Marketing Spend
                  </h2>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Track daily dollar ad spend per seller.</p>
                </div>
                <button @click="openMarketingSpendModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs shadow-md shadow-indigo-600/20 transition-all flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Add / Update Spend
                </button>
              </div>

              <div class="mb-4 flex items-center gap-4">
                <input type="date" v-model="marketingSpendFilterDate" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl text-xs font-bold text-slate-900 dark:text-slate-100 focus:outline-none" />
              </div>

              <div class="overflow-x-auto rounded-xl border border-slate-200/60 dark:border-slate-700/60 shadow-sm">
                <table class="w-full text-left border-collapse text-[11px] sm:text-xs">
                  <thead>
                    <tr class="bg-slate-50/80 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700">
                      <th class="p-3 font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Date</th>
                      <th class="p-3 font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Seller</th>
                      <th class="p-3 font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Spend ($)</th>
                      <th class="p-3 font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Last Updated By</th>
                      <th class="p-3 font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-slate-900">
                    <tr v-for="spend in filteredMarketingSpends" :key="spend.id" class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                      <td class="p-3 text-slate-600 dark:text-slate-300 font-medium">{{ spend.date }}</td>
                      <td class="p-3 font-bold text-slate-800 dark:text-slate-200">{{ getUserName(spend.sellerId) }}</td>
                      <td class="p-3 text-indigo-600 dark:text-indigo-400 font-extrabold">${{ spend.amount.toFixed(2) }}</td>
                      <td class="p-3 text-slate-500 dark:text-slate-400 text-[10px]">{{ spend.updatedBy }}</td>
                      <td class="p-3 text-right">
                        <button @click="openMarketingSpendHistory(spend)" class="px-2 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[10px] font-bold transition-colors">History</button>
                        <button @click="openMarketingSpendModal(spend)" class="px-2 py-1 bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-800/50 text-indigo-600 dark:text-indigo-400 rounded-lg text-[10px] font-bold transition-colors ml-1">Edit</button>
                      </td>
                    </tr>
                    <tr v-if="filteredMarketingSpends.length === 0">
                      <td colspan="5" class="p-8 text-center text-slate-400 dark:text-slate-500 font-medium">No marketing spend recorded for this date/filter.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </transition>
